# jishiben API — Spring Boot 3 / MySQL 8
# Every datasource and secret value comes from the environment; the defaults below are
# local-development conveniences only and never contain a real credential.
spring:
  application:
    name: jishiben-api

  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/jishiben?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}"
    username: "${DB_USER:jishiben}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: jishiben-pool
      maximum-pool-size: "${DB_POOL_MAX_SIZE:10}"
      minimum-idle: "${DB_POOL_MIN_IDLE:2}"
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. validate keeps entities and migrations from drifting apart.
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: "${JPA_SHOW_SQL:false}"

  flyway:
    enabled: "${FLYWAY_ENABLED:true}"
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      # 凭证图片单文件上限是 5 MB（ReceiptController 里校验并返回 413）；
      # 这里留 1 MB 余量，先让容器把 multipart 收下来，超限才由统一错误体回答
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: "${SERVER_PORT:8080}"
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: "${HEALTH_SHOW_DETAILS:never}"
      probes:
        enabled: true

app:
  receipts:
    # 凭证图片落盘目录。compose 里挂到宿主机 ./data/receipts，重建容器不丢图。
    dir: ${RECEIPTS_DIR:/data/receipts}
  google:
    # Google 登录的 ID Token 受众（Web application OAuth Client ID）。留空 = 该功能关闭，邮箱登录不受影响。
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  jwt:
    # Must be supplied at runtime (>= 32 bytes for HS256). Empty default fails closed.
    secret: "${JWT_SECRET:}"
    issuer: "${JWT_ISSUER:jishiben-api}"
    access-token-ttl: "${JWT_ACCESS_TTL:PT24H}"
    refresh-token-ttl: "${JWT_REFRESH_TTL:P30D}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
logging:
  level:
    root: INFO
    com.jishiben.api: "${LOG_LEVEL_APP:INFO}"
    org.flywaydb: INFO
