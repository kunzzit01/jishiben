# 单机 Docker Compose 部署（api + mysql + nginx + ocr）
# 用法（在仓库根目录）：
#   cp deploy/.env.example deploy/.env   # 填写真实口令，deploy/.env 不提交
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 仓库布局：前端在根目录（Expo app），后端在 server/，编排在本目录 deploy/。
# 端口暴露：只有 web（前端 + nginx）发布 HTTP_PORT（默认 80）；mysql 与 api 仅在内部网络可达。
name: jishiben

services:
  mysql:
    image: mysql:8.0
    container_name: jishiben-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - jishiben-net
    # 不发布端口：宿主机无法直连数据库
    healthcheck:
      # 用真实业务账号 + 真实库做探活：库没建好或账号未生效都算不健康
      test:
        - CMD-SHELL
        - mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: jishiben/api:0.1.0
    container_name: jishiben-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 全部走环境变量；代码里不落任何密钥
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      # Google 登录：ID Token 的受众白名单（Web application OAuth Client ID）。留空则功能关闭。
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      # 唯一的线上环境。模拟订阅是否开启由管理员在 App 里控制（默认关闭）；设为 false 可彻底禁用
      BILLING_ENV: production
      BILLING_SANDBOX_ALLOWED: ${BILLING_SANDBOX_ALLOWED:-true}
      BILLING_GOOGLE_ENABLED: ${BILLING_GOOGLE_ENABLED:-false}
      BILLING_ADMIN_EMAIL: ${BILLING_ADMIN_EMAIL:-}
      BILLING_ADMIN_GOOGLE_SUB: ${BILLING_ADMIN_GOOGLE_SUB:-}
      BILLING_TOKEN_ENCRYPTION_KEY: ${BILLING_TOKEN_ENCRYPTION_KEY:-}
      BILLING_PUSH_AUDIENCE: ${BILLING_PUSH_AUDIENCE:-}
      BILLING_PUSH_EMAIL: ${BILLING_PUSH_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-jishiben-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT24H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # 凭证图片落盘目录（对应 application.yml 的 app.receipts.dir）
      RECEIPTS_DIR: /data/receipts
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      TZ: UTC
    volumes:
      # 凭证图片存在宿主机：重建镜像 / 重建容器都不丢（路径对应 /api/receipts 的存储目录）
      # 首次部署先建目录并交给容器内 app 用户（uid 100 / gid 101）：
      #   mkdir -p deploy/data/receipts && sudo chown 100:101 deploy/data/receipts
      - ./data/receipts:/data/receipts
    networks:
      - jishiben-net
    # 不发布端口：外部只能经 nginx 进入
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 前端（Expo Web 静态导出）+ nginx：单容器同时提供页面与 /api 反代
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: jishiben/web:0.1.0
    container_name: jishiben-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 内测安装包下载目录：把 .apk 放进 deploy/downloads/ 即可通过
      #   http://<你的地址>:<HTTP_PORT>/downloads/xxx.apk
      # 对外提供（只读挂载，容器不能改宿主机文件）
      - ./downloads:/usr/share/nginx/html/downloads:ro
      # Play 上架要求的隐私政策页：http://<地址>:<HTTP_PORT>/privacy
      - ./public/privacy.html:/usr/share/nginx/html/privacy.html:ro
      # ACME HTTP-01 挑战根目录（Let's Encrypt IP 证书用；由 Traefik 转发到此路径）
      - ./acme-webroot:/usr/share/nginx/html/.well-known/acme-challenge:ro
    networks:
      - jishiben-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 自建 OTA 更新服务（expo-updates 协议 v1），不依赖 Expo/EAS 云端。
  # 不发布宿主端口：外部经 web 容器的 nginx 反代 /updates/ → updates:8081。
  # 代码与说明见 deploy/updates/。
  updates:
    build:
      context: ./updates
      dockerfile: Dockerfile
    image: jishiben/updates:0.1.0
    container_name: jishiben-updates
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATA_DIR: /data
      # manifest 里所有 URL 的绝对前缀，必须与客户端 updates.url 一致
      PUBLIC_BASE_URL: ${UPDATES_PUBLIC_BASE_URL:-https://187.127.125.136/updates}
      DEFAULT_CHANNEL: ${UPDATES_DEFAULT_CHANNEL:-production}
    volumes:
      # 更新包与「当前生效版本」指针放在宿主机，重建镜像/重启容器都不丢
      - ./updates/data:/data
    networks:
      - jishiben-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/healthz').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 服务端 OCR 兜底（本机 ML Kit 对 手写发票/热敏纸/反光照片 识别差时用）。
  # RapidOCR = PaddleOCR PP-OCR 的 ONNX 版；只返回文字与像素坐标，不做金额解析。
  # 不发布宿主端口：只能经 web 容器 nginx 的 /ocr/ 进入，镜像自带 HEALTHCHECK。
  # 代码与用法见 ocr-service/README.md。
  ocr:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    image: jishiben/ocr:0.1.0
    container_name: jishiben-ocr
    restart: unless-stopped
    environment:
      # 客户端必须带同名请求头 X-OCR-Key；不填则 compose 直接报错，不放行
      OCR_SHARED_KEY: ${OCR_SHARED_KEY:?OCR_SHARED_KEY is required}
      # 深度识别（第三层兜底）：默认关闭。开启时调用宿主机上的 Ollama（不占容器资源）
      OCR_DEEP_ENABLED: ${OCR_DEEP_ENABLED:-0}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
      OCR_DEEP_TIMEOUT_MS: ${OCR_DEEP_TIMEOUT_MS:-120000}
      TZ: UTC
    # 仅内网可达：只写 expose，不写 ports（宿主机无法直连 8090）
    expose:
      - "8090"
    # 让容器能访问宿主机上的 Ollama（深度识别用；Linux 必须给 host-gateway）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 单 worker 持有一份 onnx 模型 + 图片解码缓冲；Swarm 下改用 deploy.resources.limits
    mem_limit: 2g
    networks:
      - jishiben-net
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
    name: jishiben-mysql-data

networks:
  jishiben-net:
    name: jishiben-net
    driver: bridge
