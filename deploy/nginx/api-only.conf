# 反向代理：仅暴露 80，/api/* 转给 api:8080，其余一律 404。
upstream jishiben_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 小票图片走 multipart 上传，留足余量（业务端点后续任务实现）
    client_max_body_size 12m;
    client_body_timeout 30s;

    # 不对外泄露 nginx 版本号
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain application/javascript;

    # 容器自检用（不经过 api）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://jishiben_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ── 服务端 OCR 兜底（deploy/docker-compose.yml 的 ocr 服务）：/ocr/ → ocr:8090 ──
    # 用变量 + Docker 内置 DNS 让 nginx 在请求时解析上游（与 /updates/ 同一写法）：
    # ocr 容器比本容器晚起来也不会让 nginx 因 "host not found in upstream" 起不来。
    # proxy_pass 不带 URI：原样转发 /ocr/xxx，前缀由 ocr 服务自己处理。
    # X-OCR-Key 等请求头默认透传，这里不要改写 / 不要清空，否则服务端一律 401。
    location /ocr/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $ocr_upstream http://ocr:8090;
        # 服务端上限 8MB，留出 multipart 边界与表单头的余量
        client_max_body_size 10m;
        proxy_pass $ocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # 首次调用要加载 onnx 模型（数秒），给足读超时
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # actuator 不对外暴露（compose 内部探活直接用 api:8080）
    location / {
        return 404;
    }
}
